apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cadence

resources:
  - ../base
  - ingress.yaml

generators:
  - secret-generator.yaml

patches:
  - target:
      kind: Secret
      name: cadence-credentials
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          app.kubernetes.io/component: prerequisite

images:
  - name: ghcr.io/cadence-muse/cadence
    newTag: 0.2.2
  - name: ghcr.io/cadence-muse/client
    newTag: 0.2.4
