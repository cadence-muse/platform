apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadence
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver
spec:
  ingressClassName: traefik
  rules:
    - host: api.cadence.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cadence
                port:
                  number: 8080
    - host: cadence.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cadence-client
                port:
                  number: 80
  tls:
    - hosts:
        - api.cadence.app
        - cadence.app
