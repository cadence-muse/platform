apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-redis
  labels:
    app: cadence-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cadence-redis
  template:
    metadata:
      labels:
        app: cadence-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [ "sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\"" ]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadence-credentials
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping" ]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping" ]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cadence-redis-data
