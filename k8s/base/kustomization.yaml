apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cadence

resources:
  - postgres
  - redis
  - cadence-server
  - cadence-client
  - namespace.yaml
  - configmap.yaml
  - ratelimit.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: cadence
