apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-client
  labels:
    app: cadence-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadence-client
  template:
    metadata:
      labels:
        app: cadence-client
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cadence-client
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cadence-client
          image: ghcr.io/cadence-muse/client:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
