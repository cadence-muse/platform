name: Apply Kubernetes Manifests

on:
  workflow_dispatch:

concurrency:
  group: cadence-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Set up ksops
        run: |
          curl -s https://raw.githubusercontent.com/viaduct-ai/kustomize-sops/master/scripts/install-ksops-archive.sh | bash

      - name: Set up Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply prerequisites
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          kustomize build --enable-alpha-plugins --enable-exec k8s/prod > rendered.yaml
          kubectl apply -f rendered.yaml -l app.kubernetes.io/component=prerequisite

      - name: Wait for prerequisites
        run: |
          kubectl rollout status deployment/cadence-db -n cadence --timeout=300s
          kubectl rollout status deployment/cadence-redis -n cadence --timeout=300s

      - name: Run migrations
        run: |
          kubectl delete job/cadence-migrate -n cadence --ignore-not-found --wait=true
          kubectl apply -f rendered.yaml -l app.kubernetes.io/component=migration
          if ! kubectl wait --for=condition=complete job/cadence-migrate -n cadence --timeout=300s; then
            kubectl describe job/cadence-migrate -n cadence
            kubectl logs job/cadence-migrate -n cadence --all-containers
            exit 1
          fi

      - name: Apply manifests
        run: kubectl apply -f rendered.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cadence -n cadence --timeout=300s
          kubectl rollout status deployment/cadence-client -n cadence --timeout=300s
