name: Validate Configs

on:
  pull_request:
    paths: [ 'k8s/**' ]
  push:
    branches: [ main ]
    paths: [ 'k8s/**' ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [base, production, dev, logging]
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Build kustomization
        run: kubectl kustomize k8s/${{ matrix.overlay }} > rendered.yaml

      - name: Validate rendered manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            rendered.yaml
